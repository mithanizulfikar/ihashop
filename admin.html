<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — IHA Online Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div class="navbar">
  <a href="index.html" class="brand">
    <img src="assets/images/logo.jpeg" alt="IHA Online Shop logo">
    <div>
      <h1>IHA Online Shop</h1>
      <span>SEE · SHOP · SHARE</span>
    </div>
  </a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li id="navAllProducts"><a href="shop.html">All Products</a></li>
  </ul>
  <div class="nav-actions">
    <a href="cart.html" class="cart-btn">Cart <span class="cart-count" id="cartCount">0</span></a>
  </div>
</div>

<!-- LOGIN VIEW -->
<div class="panel" id="loginPanel">
  <h2>Admin Login</h2>
  <div class="field"><label>Password</label><input id="adminPassInput" type="password" placeholder="Enter admin password"></div>
  <button class="primary-btn full-width" id="loginBtn">Enter</button>
  <p class="form-note">Default demo password: <strong>iha-admin-2026</strong>. Change it in <code>api/config.php</code> before going live.</p>
</div>

<!-- ADMIN DASHBOARD (hidden until logged in) -->
<div class="panel" id="dashboardPanel" style="display:none;max-width:900px;">
  <button class="logout-link" id="logoutBtn">Log out</button>
  <h2>Admin Panel</h2>
  <div class="admin-tabs">
    <button class="admin-tab active" id="tabProductsBtn">Products</button>
    <button class="admin-tab" id="tabOrdersBtn">Orders</button>
  </div>
  <div id="adminProductsView"></div>
  <div id="adminOrdersView" style="display:none;"></div>
</div>

<div class="footer">
  © 2026 IHA Online Shop · All rights reserved
  <div class="footer-links">
    <a href="about.html">About</a> · <a href="contact.html">Contact</a> · <a href="faqs.html">FAQs</a> · <a href="help-center.html">Help Center</a><span id="adminFooterLink"></span>
  </div>
</div>

<script src="assets/js/cart.js"></script>
<script src="assets/js/admin.js"></script>
</body>
</html>
