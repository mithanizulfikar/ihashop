<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All Products — IHA Online Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div class="navbar">
  <a href="index.html" class="brand">
    <img src="assets/images/logo.jpeg" alt="IHA Online Shop logo">
    <div>
      <h1>IHA Online Shop</h1>
      <span>SEE · SHOP · SHARE</span>
    </div>
  </a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li id="navAllProducts"><a href="shop.html" class="active">All Products</a></li>
    <li><a href="track-order.html">Track Order</a></li>
  </ul>
  <div class="nav-actions">
    <div class="search-box">
      <span>🔍</span>
      <input id="searchInput" placeholder="Search everything…">
    </div>
    <a href="cart.html" class="cart-btn">Cart <span class="cart-count" id="cartCount">0</span></a>
  </div>
</div>

<div class="hero" style="padding:40px 32px;">
  <div class="tagline">ALL PRODUCTS</div>
  <h2 class="display">Browse the whole shop.</h2>
</div>

<div class="shop-layout">
  <aside class="filter-sidebar" id="filterSidebar">
    <h3>Filters</h3>
    <div class="filter-group">
      <h4>Category</h4>
      <div id="categoryCheckboxList">
        <label class="filter-checkbox"><input type="checkbox" disabled> Loading…</label>
      </div>
    </div>
    <div class="filter-group">
      <h4>Price Range</h4>
      <div class="price-range-inputs">
        <input type="number" id="minPriceInput" placeholder="Min">
        <span>–</span>
        <input type="number" id="maxPriceInput" placeholder="Max">
      </div>
    </div>
    <div class="filter-group filter-sort">
      <h4>Sort By</h4>
      <select id="sortSelect">
        <option value="">Default</option>
        <option value="price_asc">Price: Low to High</option>
        <option value="price_desc">Price: High to Low</option>
        <option value="name_asc">Name: A to Z</option>
        <option value="name_desc">Name: Z to A</option>
        <option value="newest">Newest First</option>
      </select>
    </div>
    <button class="primary-btn filter-apply-btn" id="applyFiltersBtn">Apply Filters</button>
    <button class="filter-clear" id="clearFiltersBtn">Clear all</button>
  </aside>
  <div>
    <div class="shop-main-header">
      <button class="mobile-filter-toggle" id="mobileFilterToggle">Filters</button>
      <span class="results-count" id="resultsCount"></span>
    </div>
    <div class="product-grid" id="productGrid"></div>
  </div>
</div>

<div class="footer">
  © 2026 IHA Online Shop · All rights reserved
  <div class="footer-links">
    <a href="about.html">About</a> · <a href="contact.html">Contact</a> · <a href="faqs.html">FAQs</a> · <a href="help-center.html">Help Center</a><span id="adminFooterLink"></span>
  </div>
</div>

<script src="assets/js/cart.js"></script>
<script>window.PAGE_CATEGORY = "all";</script>
<script src="assets/js/shop.js"></script>
</body>
</html>
